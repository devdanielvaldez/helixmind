[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helixmind"
version = "0.1.0"
description = "Autonomous scientific research platform using local LLMs"
authors = [{ name = "HelixMind Team" }]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "rdkit>=2023.9.0",
    "reportlab>=4.0.0",
    "bibtexparser>=1.4.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
helixmind = "helixmind.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
